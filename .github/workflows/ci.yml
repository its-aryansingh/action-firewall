name: verify

# Why this exists in this shape.
#
# A benchmark that lives only in a script is a number somebody once ran. The
# strongest packaging in this buildathon's field (souvikDevloper/closepilot)
# gates its evaluation in CI, so its headline number cannot rot. This does the
# same: every benchmark below exits non-zero on failure, so a regression in the
# authorization path fails the build rather than quietly changing a README.
#
# The benchmarks are NOT allowed to be advisory here. If the policy benchmark
# ever authorises a violation, if the concurrency benchmark's reservation arm
# ever breaches its cap, or if the ablation finds a rule that never changes an
# outcome, that is a broken build.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile every module
        run: python -m compileall -q app tests scripts

      - name: Tests
        env:
          DEMO_MODE: "true"
          PAYMENT_PROVIDER: simulated
          FAULT_INJECTION_ENABLED: "true"
          ENVELOPE_DRAFTING_MODE: replay
          CATALOG_RETRIEVAL_MODE: keyword
        run: python -m pytest -q

      # The two claims the submission rests on, re-proved on every push.
      - name: "Policy benchmark: no violation may be authorised"
        env:
          DEMO_MODE: "true"
          PAYMENT_PROVIDER: simulated
          FAULT_INJECTION_ENABLED: "true"
        run: python scripts/benchmark_agent_authorization.py --k 5

      - name: "Concurrency benchmark: the reservation arm may never breach its cap"
        env:
          DEMO_MODE: "true"
          PAYMENT_PROVIDER: simulated
          FAULT_INJECTION_ENABLED: "true"
        run: python scripts/benchmark_concurrency.py --threads 16 --trials 20

      # A rule that never changes an outcome is not a safety control, it is a
      # comment with a runtime cost. The ablation removes one rule at a time and
      # exits non-zero if any of them turns out to be dead weight — so this step
      # fails when the layer grows a rule the corpus never exercises, which is
      # exactly when a reviewer would otherwise stop believing the zero.
      - name: "Ablation: every rule must change at least one outcome"
        env:
          DEMO_MODE: "true"
          PAYMENT_PROVIDER: simulated
          FAULT_INJECTION_ENABLED: "true"
        run: python scripts/ablation.py

      # Exits non-zero if a violating family is added to the corpus without
      # saying which document would have prevented it. Without that, the
      # publication-value percentage rises for free every time the corpus grows.
      - name: "Publication value: every violating family must be labelled"
        env:
          DEMO_MODE: "true"
          PAYMENT_PROVIDER: simulated
          FAULT_INJECTION_ENABLED: "true"
        run: python scripts/publication_value.py

      - name: Deterministic authorization evaluation
        env:
          DEMO_MODE: "true"
          PAYMENT_PROVIDER: simulated
          FAULT_INJECTION_ENABLED: "true"
        run: python scripts/evaluate_autopilot.py

      # Fails if any real key, secret or database file was ever committed.
      - name: No secrets in the tree
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.sqlite3?$'; then
            echo "::error::a .env or database file is tracked"; exit 1
          fi
          if git grep -nE 'rzp_(live|test)_[A-Za-z0-9]{10,}' -- . ':!*.md' ':!.github/*'; then
            echo "::error::a Razorpay key literal is committed"; exit 1
          fi

  # A deployable repository is a claim like any other, and it rots the same way:
  # someone adds an import, or moves a file the Dockerfile copies, and nobody
  # finds out until a judge clicks the link. These are the exact two builds
  # Railway runs, so a broken deploy fails here first.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build context is the repository root: the image copies data/catalog.json,
      # which lives outside backend/.
      - name: Backend image
        run: docker build -f backend/Dockerfile -t action-firewall-backend:ci .

      - name: Backend image answers its health check
        run: |
          docker run -d --name af -e PORT=8000 -p 8000:8000 action-firewall-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          # The deployed demo must never report a live provider. This is the same
          # promise DEPLOY.md tells a reviewer to verify with curl.
          grep -q '"payment_provider": *"simulated"' /tmp/health.json \
            || { echo "::error::deployed image does not report the simulated provider"; \
                 docker logs af; exit 1; }
          docker rm -f af

      # Context is frontend/ alone — the frontend needs nothing from the repo
      # root, which is what lets its Railway service scope to that directory.
      # NEXT_PUBLIC_API_BASE is required at BUILD time; the Dockerfile fails
      # rather than bake in a localhost API base, so this arg is not optional.
      - name: Frontend image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE=https://ci.invalid \
            -t action-firewall-frontend:ci frontend

      - name: Frontend image serves the control plane
        run: |
          docker run -d --name fe -e PORT=3000 -p 3000:3000 action-firewall-frontend:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ > /dev/null \
            || { echo "::error::frontend image did not serve /"; docker logs fe; exit 1; }
          docker rm -f fe

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Matches frontend/Dockerfile, so a version-sensitive build failure shows
      # up in CI rather than only in the deployed image.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true
